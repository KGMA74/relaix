version: v2

modules:
  - path: proto

lint:
  use:
    - STANDARD
  except:
    # DeviceGateway is not renamed to DeviceGatewayService: "Gateway" already
    # names the thing, and the suffix adds nothing at the call site.
    - SERVICE_SUFFIX
    # Connect streams DeviceMessage and ServerMessage, which are bidirectional
    # envelopes carrying a oneof payload — not a request paired with a response.
    # Renaming them ConnectRequest/ConnectResponse would describe them wrongly.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME

breaking:
  use:
    - FILE
