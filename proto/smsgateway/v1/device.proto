// Relaix — contract between the control plane and the Android agents.
//
// Field-by-field rationale lives in docs/protocol.md; that document is the
// specification this file implements. Keep the two in sync.
//
// Compatibility rule for package v1: only additive changes. Add fields with
// fresh numbers, add oneof cases, add enum values. Never renumber a field,
// never change a type, never reuse a retired number (mark it reserved).
// Breaking changes go to a new package served alongside this one, because the
// fleet updates by app-store rollout and old agents must keep working.

syntax = "proto3";

package smsgateway.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/KGMA74/relaix-server/gen/smsgateway/v1;smsgatewayv1";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service DeviceGateway {
  // Called once in a device's lifetime. Trades a short-lived enrollment token
  // (scanned from a QR code) for a long-lived device token. Kept separate from
  // Connect because it authenticates differently, which lets the stream keep a
  // uniform rule: every message on Connect carries a device_token.
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Held open for the device's entire uptime. The agent dials out — phones sit
  // behind carrier NAT and can never be reached inbound — and the server pushes
  // work down the connection the device already opened.
  rpc Connect(stream DeviceMessage) returns (stream ServerMessage);
}

// ---------------------------------------------------------------------------
// Enrollment
// ---------------------------------------------------------------------------

message EnrollRequest {
  // Single-use token from the QR code. Consumed atomically by the server, so a
  // screenshot of the QR is worthless after the first enrollment.
  string enrollment_token = 1;

  DeviceInfo device_info = 2;
}

message EnrollResponse {
  // Server-assigned stable identifier. This is the value callers pass as
  // deviceId on POST /send.
  string device_id = 1;

  // Long-lived credential, returned exactly once. The server keeps only a hash.
  string device_token = 2;
}

// Descriptive information about a handset. Sent at enrollment and again on
// every Register, so the server's view survives OS updates and SIM swaps.
message DeviceInfo {
  // Human-readable name for the operator ("desk phone", "SIM Orange 2").
  string label = 1;

  // The device's own MSISDN in E.164. This is the number recipients see, since
  // there is no custom sender ID. May be empty: Android cannot always read it.
  string phone_number = 2;

  string manufacturer = 3;
  string model = 4;

  // Android release, e.g. "14". Also a hint for platform-specific SMS quirks.
  string os_version = 5;

  // Agent app version. Needed to interpret behaviour during a staged rollout.
  string agent_version = 6;

  // Network operator from the SIM. Relevant because sending limits are per
  // carrier.
  string carrier = 7;

  // Every SIM the handset can send from.
  //
  // phone_number and carrier above describe the *default* SMS subscription
  // only, which is what a single-SIM phone reports and what a dual-SIM phone
  // would send from if nobody said otherwise. They stay because every existing
  // agent fills them and every existing row was written from them.
  //
  // A dual-SIM handset is really two sending nodes: sending limits are per SIM
  // and the number a recipient sees is per SIM. Listing them lets a caller
  // name one on SendSmsJob instead of being stuck with whatever the phone's
  // settings happen to say.
  repeated SimInfo sims = 8;

  // Stable identifier of this handset, so the fleet holds one entry per phone.
  // On Android, Settings.Secure.ANDROID_ID: scoped to the app's signing key,
  // the user and the device, so it survives a reinstall but is meaningless to
  // any other app. Read on Enroll: a phone that enrolls again — after a
  // reinstall, a forget, a lost token — takes back its existing device, id and
  // history included, instead of adding a second one. The server stores only
  // an HMAC of it, never the value. Empty from agents that predate it, which
  // then enroll as a new device every time, as before.
  string hardware_id = 9;

  // IANA zone the handset is set to, e.g. "Africa/Ouagadougou". The default
  // zone for its availability windows (DevicePolicy), so "08:00" means eight
  // in the morning where the phone is, not where the server runs.
  string time_zone = 10;

  // What this agent can do beyond sending SMS, so the server never hands a
  // job to an agent that would not understand it: an unknown ServerMessage
  // payload is silently dropped by an older agent, and the job would sit
  // assigned to a phone that never saw it. Values:
  //   "ussd"         runs a UssdJob with no replies (one request, one answer)
  //   "ussd_menu"    also runs one with replies (a menu, step by step)
  //   "inbound_sms"  forwards received SMS (SmsReceived) when its rules say so
  // Empty from agents that predate the field: SMS only.
  repeated string capabilities = 11;
}

// One SIM the agent can send from.
message SimInfo {
  // Android's subscription id. Stable while the SIM stays in the phone, and
  // the value SendSmsJob.subscription_id refers to. Not a slot: slots get
  // reused when a SIM is swapped, which would silently redirect traffic.
  int32 subscription_id = 1;

  // Physical slot, 0-based. Reported for the operator's benefit — "the one in
  // the top tray" is how people actually talk about SIMs — never for routing.
  int32 slot_index = 2;

  // MSISDN in E.164 when the platform will say. Often empty; carriers do not
  // reliably write it to the SIM.
  string phone_number = 3;

  string carrier = 4;

  // What the user named it in Android's settings, e.g. "Perso" or "Work".
  string display_name = 5;

  // Whether this SIM is the default for outgoing SMS. Exactly one is, and it
  // is the one used when a job names no subscription.
  bool is_default_sms = 6;
}

// ---------------------------------------------------------------------------
// Stream envelopes
// ---------------------------------------------------------------------------

// Device to server. A oneof rather than several optional fields so that
// "exactly one payload" is enforced by the schema instead of by a validator.
message DeviceMessage {
  // Sender-generated UUID. Lets the server drop a message replayed after a
  // reconnect, and ties log lines on both sides together.
  string message_id = 1;

  // Authenticates this message. Present on every message rather than once at
  // stream open, so each frame is verifiable on its own terms and the handler
  // holds no per-connection auth state.
  string device_token = 2;

  // When the agent produced the message. Compared against server time to spot
  // a skewed clock and to separate queueing delay from network delay.
  google.protobuf.Timestamp sent_at = 3;

  oneof payload {
    Register register = 10;
    Heartbeat heartbeat = 11;
    JobAck job_ack = 12;
    JobResult job_result = 13;
    Leave leave = 14;
    PolicyUpdate policy_update = 15;
    SmsReceived sms_received = 16;
  }
}

// Server to device. No token in this direction: the device authenticated the
// server by TLS when it dialed, and it is reading a stream it opened itself.
message ServerMessage {
  string message_id = 1;
  google.protobuf.Timestamp sent_at = 2;

  oneof payload {
    RegisterAck register_ack = 10;
    SendSmsJob send_sms_job = 11;
    CancelJob cancel_job = 12;
    Ping ping = 13;

    // The rules changed — from the dashboard, or from this phone and now
    // stored. Replaces the phone's copy.
    DevicePolicy policy = 14;

    UssdJob ussd_job = 15;
    SmsReceivedAck sms_received_ack = 16;
  }
}

// ---------------------------------------------------------------------------
// Device -> server payloads
// ---------------------------------------------------------------------------

// First message on every new stream. Announces that the device is reachable on
// this connection.
message Register {
  DeviceInfo device_info = 1;

  // Initial snapshot, so the scheduler can consider the device immediately
  // instead of waiting for the first heartbeat.
  DeviceHealth health = 2;

  // Jobs the agent believes it still holds from a previous connection. Lets the
  // server reconcile after a reconnect rather than blindly re-dispatching work
  // that is already in flight on the handset.
  repeated string pending_job_ids = 3;
}

// The device is leaving the fleet for good: its operator chose to forget the
// enrollment on the phone. The server retires the device — the same as
// DELETE /devices/{id} — and closes the stream. Sent best-effort before the
// agent drops its token: a phone offline at that moment cannot say goodbye,
// and stays listed until an operator removes it.
// The operator edited this phone's rules on the phone itself. The server
// validates and stores them, then sends the result back as a DevicePolicy —
// the same message a dashboard edit produces — so both sides end up holding
// what the server holds. Last write wins: the server stamps a new version.
message PolicyUpdate {
  DevicePolicy policy = 1;
}

// When and for what a device takes work. Held by the server, which is the only
// one that enforces it: the scheduler never hands a job to a device, or a SIM,
// whose rules refuse it. Editable from the dashboard and from the phone; each
// copy is a view of the server's.
//
// Every field's empty value means "no restriction", so the zero policy is a
// phone that sends anything, any time — what every device was before rules
// existed.
message DevicePolicy {
  // Server-assigned, incremented on every change. Lets a holder tell whether
  // its copy is current.
  int64 version = 1;

  Availability availability = 2;
  AcceptRules accept = 3;

  // Per-SIM rules, on top of the device's: a SIM must satisfy both.
  repeated SimPolicy sims = 4;

  google.protobuf.Timestamp updated_at = 5;

  // How much the device may send, all SIMs together.
  SendLimits limits = 6;

  // Which received SMS the phone forwards. Off unless turned on.
  InboundRules inbound = 7;
}

// Which received SMS a phone forwards to the server. Applied on the phone,
// before anything leaves it: a message these rules do not cover is never
// sent, so turning forwarding on for "OrangeMoney" does not hand the server
// the owner's personal conversations.
message InboundRules {
  // Forward at all. False, the default, forwards nothing.
  bool enabled = 1;

  // Senders to forward, compared case-insensitively and whole: an
  // alphanumeric sender id ("OrangeMoney") or a number in E.164. Empty, with
  // enabled set: every sender.
  repeated string senders = 2;
}

// Caps on what a device or a SIM is handed. Carriers throttle or block a SIM
// that sends too much, so a phone should stop being chosen before that, not
// after. Counted by the server over sliding windows, in messages handed to the
// device — a multipart message counts once — including those still in flight.
// A device or SIM at its cap is "not now": queued jobs wait or go elsewhere.
message SendLimits {
  // Messages in the last 60 minutes. 0: no cap.
  int32 per_hour = 1;

  // Messages in the last 24 hours. 0: no cap.
  int32 per_day = 2;
}

// When a device takes work.
message Availability {
  // IANA zone the windows are read in. Empty: the zone the phone reports
  // (DeviceInfo.time_zone), then UTC.
  string time_zone = 1;

  // Available while inside any window. None: always available.
  repeated TimeWindow windows = 2;
}

// A daily slot, e.g. weekdays 08:00–20:00.
message TimeWindow {
  // ISO weekdays, 1 = Monday … 7 = Sunday. Empty: every day.
  repeated int32 days = 1;

  // Minutes since midnight, start inclusive, end exclusive. An end at or
  // before the start runs past midnight into the next day, so 22:00–06:00 is
  // one window. Both 0 is the whole day.
  int32 start_minute = 2;
  int32 end_minute = 3;
}

// Which recipients a device or SIM accepts. Both conditions must hold.
message AcceptRules {
  // ISO 3166-1 alpha-2 codes, matched on the recipient's country calling
  // code. Empty: any country. Countries that share a code (+1 for the NANP)
  // cannot be told apart by the number alone; allowing one allows them all.
  repeated string countries = 1;

  // RE2 regular expression the E.164 recipient must match, e.g. "^\+22670".
  // Empty: any number.
  string recipient_pattern = 2;
}

// Rules for one SIM of a multi-SIM phone.
message SimPolicy {
  // SimInfo.subscription_id of the SIM these rules are for.
  int32 subscription_id = 1;

  // Never send from this SIM.
  bool disabled = 2;

  AcceptRules accept = 3;

  // Narrows the device's availability for this SIM: both must hold.
  Availability availability = 4;

  // Caps for this SIM alone, on top of the device's.
  SendLimits limits = 5;
}

message Leave {
  // Free text for the log, e.g. "forgotten on the device".
  string reason = 1;
}

// An SMS the phone received and its InboundRules forward. The agent keeps it
// until the server acknowledges it (SmsReceivedAck), and sends it again on
// every reconnect until then: a message received while offline still arrives.
message SmsReceived {
  // Agent-generated, stable across resends: the server records one message
  // per id and device, however often it arrives.
  string id = 1;

  // As the network presented it: an alphanumeric sender id or a number.
  string sender = 2;

  // The whole text, multipart messages joined.
  string body = 3;

  // When the network delivered it to the phone.
  google.protobuf.Timestamp received_at = 4;

  // The SIM it arrived on (SimInfo.subscription_id); 0 when unknown.
  int32 subscription_id = 5;
}

// Sent on the interval given in RegisterAck. Proves liveness and carries fresh
// health. A device whose heartbeats stop is dropped from the ready set even if
// the socket still looks alive — a phone in a tunnel often leaves one that does.
message Heartbeat {
  DeviceHealth health = 1;
}

message DeviceHealth {
  // 0-100. A phone below a threshold is deprioritized: sending on a dying
  // battery risks the agent being killed mid-job.
  int32 battery_level = 1;

  // A charging phone at 15% is fine; an unplugged one is not. The pair is more
  // informative than the level alone.
  bool is_charging = 2;

  // Normalized 0-4, NOT raw dBm. Android reports a different raw scale per
  // radio technology (GSM RSSI, LTE RSRP, NR SS-RSRP), so raw values are not
  // comparable across a mixed fleet. 0 = unusable, 4 = great. Level 0 excludes
  // the device from the ready set.
  int32 signal_strength = 3;

  // e.g. "LTE", "NR", "GSM". Diagnostic context for the signal level.
  string network_type = 4;

  // Whether the SIM is present and unlocked. A phone can be perfectly healthy
  // and still have no usable SIM.
  bool sim_ready = 5;

  // SMS sent in the trailing hour, as counted by the agent. Feeds per-device
  // rate limiting so the fleet does not trip a carrier's anti-spam thresholds.
  // Advisory in V1; server-side enforcement is a later change.
  int32 sent_last_hour = 6;

  // Whether SEND_SMS and the other runtime permissions are currently granted.
  // A user can revoke them at any time; without this the failure mode is a
  // device that accepts jobs and fails every one.
  bool permissions_ok = 7;

  // Per-SIM figures, when the handset has more than one.
  //
  // The fields above summarise the default SMS subscription, which is all a
  // single-SIM phone has. These carry what differs between SIMs: signal is per
  // radio, and the hourly count that matters for rate limiting is per SIM,
  // because the carrier meters the SIM and not the handset.
  repeated SimHealth sims = 8;
}

// The changing half of a SIM. Identity lives in SimInfo; this is what a
// heartbeat refreshes.
message SimHealth {
  // Matches SimInfo.subscription_id.
  int32 subscription_id = 1;

  // Normalized 0-4, same scale and same reason as the field above.
  int32 signal_strength = 2;

  bool sim_ready = 3;

  // SMS parts sent from this SIM in the trailing hour. The per-device total
  // above is the sum, and it is the wrong number to rate limit on: two SIMs
  // each at their carrier's ceiling look like one device at twice the limit.
  int32 sent_last_hour = 4;
}

// Sent as soon as the agent receives a job, before attempting to send. The
// server writing to the stream is not evidence the phone got it, and a fast
// explicit refusal lets the scheduler reassign on the next tick instead of
// waiting for a timeout.
message JobAck {
  string job_id = 1;

  // False when the device knows it cannot: no SIM, permissions revoked, rate
  // cap reached.
  bool accepted = 2;

  // Why it was refused; empty when accepted. Surfaced in job_events.
  string reason = 3;

  // Whether retrying could ever help.
  //
  // Some refusals will not change by waiting: a SIM the handset does not have,
  // a recipient the job never carried, a deadline already past. Releasing
  // those back to the queue burns the job's attempts on a device that will
  // refuse identically every time, and the caller ends up with a generic
  // "too many attempts" instead of the reason the agent already knew.
  //
  // Default false means transient, which is how every refusal behaved before
  // this field existed — an agent that does not set it keeps working.
  bool permanent = 4;
}

// Terminal outcome, sent once the platform reports back. May arrive more than
// once after a reconnect; a repeat for an already-terminal job is a no-op.
message JobResult {
  string job_id = 1;
  JobStatus status = 2;

  // Platform or carrier identifier when failed, e.g. the SmsManager result
  // code. Stable enough to match on in automation.
  string error_code = 3;

  // Human-readable detail for operators.
  string error_message = 4;

  // Number of SMS parts actually sent. A long or non-GSM-7 body is split into
  // several billed messages; callers need this to reconcile cost.
  int32 parts_sent = 5;

  // When the platform reported the outcome on the device.
  google.protobuf.Timestamp completed_at = 6;

  // For a UssdJob: what the network displayed, one entry per screen, in
  // order — the answer to the code, then to each reply. Also on a failure,
  // up to the screen where it stopped.
  repeated string responses = 7;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;

  // The handset handed the message to the network.
  JOB_STATUS_SENT = 1;

  // A delivery report came back from the recipient's network. Many carriers
  // never send one, so this is a bonus, not the expected terminal state — a
  // caller that waits for it will wait forever on some networks.
  JOB_STATUS_DELIVERED = 2;

  JOB_STATUS_FAILED = 3;
  JOB_STATUS_CANCELLED = 4;
}

// ---------------------------------------------------------------------------
// Server -> device payloads
// ---------------------------------------------------------------------------

message RegisterAck {
  // False when the token is invalid or an operator disabled the device.
  bool accepted = 1;

  // Why, when refused. The agent shows this rather than retrying blindly.
  string reason = 2;

  // How often to heartbeat. Server-controlled so the cadence can be tuned
  // fleet-wide without shipping a new app: the trade-off between detection
  // latency and battery is an operator's call.
  int32 heartbeat_interval_seconds = 3;

  // Of the pending_job_ids the device reported, those the server considers
  // dead. The agent drops them instead of sending a message the server already
  // gave up on and possibly re-dispatched elsewhere.
  repeated string stale_job_ids = 4;

  // The device's current rules, so a phone that reconnects shows what the
  // server enforces, whatever changed while it was away.
  DevicePolicy policy = 5;
}

message SendSmsJob {
  // Server-assigned. The idempotency key: an agent that has already handled
  // this id must not send again. Job delivery is at-least-once.
  string job_id = 1;

  // Destination number, E.164.
  string recipient = 2;

  // Message text, UTF-8. The agent splits it into parts, not the server — part
  // counting depends on encoding decisions the platform makes.
  string body = 3;

  // Local ordering hint for an agent holding several jobs at once. Scheduling
  // priority is applied server-side; this only orders an assigned batch.
  int32 priority = 4;

  // After this the agent must not send and reports the job failed. Stops a
  // phone that was offline for hours from delivering a stale OTP on reconnect:
  // late delivery of a time-sensitive message is worse than none.
  google.protobuf.Timestamp expires_at = 5;

  // Which SIM to send from, matching a SimInfo.subscription_id the device
  // reported. Zero means "the handset's default SMS subscription", which is
  // what every job carried before this field existed and what a single-SIM
  // phone always uses.
  //
  // A named subscription the device does not have is refused in JobAck rather
  // than quietly sent from another SIM: the recipient sees the sender's
  // number, and silently changing it would bill the wrong SIM and break any
  // reply the caller expected.
  int32 subscription_id = 6;
}

// Run a USSD code on one SIM and report what the network answers, in a
// JobResult: SENT with the screens in responses when the network answered,
// FAILED otherwise. Acknowledged with JobAck like a SendSmsJob, and only sent
// to an agent that lists "ussd" in its capabilities ("ussd_menu" when replies
// is not empty).
message UssdJob {
  // Server-assigned; the idempotency key, as for SendSmsJob. A USSD session
  // can move money: an agent that has seen this id must never run it again.
  string job_id = 1;

  // What is dialed, e.g. "*144#" or "*144*2*1*70000000*5000#".
  string code = 2;

  // The SIM to dial from (SimInfo.subscription_id); 0 is the handset's
  // default. A subscription the device does not have is refused in JobAck.
  int32 subscription_id = 3;

  // After this the agent must not dial, and reports the job failed.
  google.protobuf.Timestamp expires_at = 4;

  // Answers to the menus the code opens, in order: each is typed into the
  // screen the network shows, the way a person would. Empty: the code alone,
  // one request and one answer.
  repeated string replies = 5;
}

// The server has recorded these SmsReceived ids: the agent may forget them.
message SmsReceivedAck {
  repeated string ids = 1;
}

// Sent when DELETE /jobs/:id arrives for a job already pushed to a device.
// Best-effort: once the handset has passed the message to the network there is
// no recall, so the agent cancels only if it has not sent yet and reports the
// real outcome either way.
message CancelJob {
  string job_id = 1;
}

// Application-level liveness check on top of HTTP/2 keepalive, to detect a
// half-open connection the transport still believes is healthy. The agent
// responds with its next heartbeat.
message Ping {}
