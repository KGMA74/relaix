version: v2

# proto/ is the single source of truth for the contract; the generated code
# belongs to whichever repo consumes it — server/ for Go, android/ for
# Kotlin — not to this repo. That keeps this repo free of any Go module or
# Android toolchain while leaving each consumer buildable on its own.
#
# Run `buf generate` from this directory after any change to proto/, and
# commit the regenerated files in the affected submodule(s) alongside the
# proto change.

clean: true

plugins:
  # --- Go, for server/ (relaix-server) ---
  # protoc-gen-go and protoc-gen-go-grpc are local Go plugins (go install).
  - local: protoc-gen-go
    out: server/gen
    opt: paths=source_relative

  - local: protoc-gen-go-grpc
    out: server/gen
    opt: paths=source_relative

  # --- Kotlin/Java, for android/ (relaix-agent) ---
  # Remote BSR plugins: no local toolchain needed to regenerate, matching the
  # "no protoc, no plugin set to keep in sync" goal on the Go side. Full
  # protobuf-java/grpc-java, not the *lite* runtimes: no javalite plugin is
  # published on the BSR, and adding one would mean maintaining a local
  # protoc + protoc-gen-javalite toolchain just for this. The APK-size
  # tradeoff is accepted; the gRPC Kotlin coroutine stubs are generated on
  # top of the Java classes, all four plugins write into the same tree so
  # a single source root covers everything.
  #
  # Pinned, and to the runtimes in android/gradle/libs.versions.toml
  # (protobuf, grpc, grpcKotlin). Unpinned, a remote plugin is whatever the
  # BSR serves that day: generated code newer than the runtime it links
  # against fails at class load ("gencode 4.36.2, runtime 4.35.1") and the
  # app crashes on start. Bump these together with the runtime versions.
  - remote: buf.build/protocolbuffers/java:v35.1
    out: android/gen
  - remote: buf.build/protocolbuffers/kotlin:v35.1
    out: android/gen
  - remote: buf.build/grpc/java:v1.83.1
    out: android/gen
  - remote: buf.build/grpc/kotlin:v1.5.0
    out: android/gen
